<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 640" width="360" height="640">
<defs>
  <radialGradient id="skin" cx="45%" cy="35%" r="70%"><stop offset="0" stop-color="#e8b892"/><stop offset=".7" stop-color="#cf9670"/><stop offset="1" stop-color="#b57e5a"/></radialGradient>
  <linearGradient id="skinL" x1="0" x2="1"><stop offset="0" stop-color="#e4b08a"/><stop offset="1" stop-color="#c48a63"/></linearGradient>
  <linearGradient id="shirt" x1="0" x2="1"><stop offset="0" stop-color="#ffffff"/><stop offset=".6" stop-color="#f3f4f8"/><stop offset="1" stop-color="#d9dce6"/></linearGradient>
  <linearGradient id="sleeve" x1="0" x2="1"><stop offset="0" stop-color="#fbfbfd"/><stop offset="1" stop-color="#d6d9e3"/></linearGradient>
  <linearGradient id="pants" x1="0" x2="1"><stop offset="0" stop-color="#3a4066"/><stop offset=".5" stop-color="#2a2f52"/><stop offset="1" stop-color="#1b1f3b"/></linearGradient>
  <radialGradient id="hair" cx="40%" cy="30%" r="80%"><stop offset="0" stop-color="#3b2a20"/><stop offset="1" stop-color="#140d09"/></radialGradient>
  <radialGradient id="beard" cx="50%" cy="20%" r="90%"><stop offset="0" stop-color="#3a2a20"/><stop offset="1" stop-color="#1a110c"/></radialGradient>
  <radialGradient id="shadow"><stop offset="0" stop-color="#1d2140" stop-opacity=".28"/><stop offset="1" stop-color="#1d2140" stop-opacity="0"/></radialGradient>
  <linearGradient id="shoe" x1="0" x2="0" y1="0" y2="1"><stop offset="0" stop-color="#ffffff"/><stop offset="1" stop-color="#dfe1e8"/></linearGradient>
</defs>
<style>
  .body{animation:breathe 4s ease-in-out infinite;transform-box:view-box;transform-origin:180px 600px}
  .head{animation:tilt 8s ease-in-out infinite;transform-box:view-box;transform-origin:180px 200px}
  .waveArm{animation:raise 8s cubic-bezier(.6,0,.3,1) infinite;transform-box:view-box;transform-origin:236px 228px}
  .waveFore{animation:wave 8s ease-in-out infinite;transform-box:view-box;transform-origin:236px 300px}
  .presentArm{animation:present 8s cubic-bezier(.6,0,.3,1) infinite;transform-box:view-box;transform-origin:124px 228px}
  .presentFore{animation:presentF 8s cubic-bezier(.6,0,.3,1) infinite;transform-box:view-box;transform-origin:124px 300px}
  .eye{animation:blink 4.5s infinite;transform-box:fill-box;transform-origin:center}
  .shadowE{animation:shadowP 4s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
  @keyframes breathe{0%,100%{transform:translateY(0) scaleY(1)}50%{transform:translateY(-2px) scaleY(1.004)}}
  @keyframes shadowP{0%,100%{transform:scaleX(1)}50%{transform:scaleX(.97)}}
  @keyframes tilt{0%,100%{transform:rotate(0)}12%,38%{transform:rotate(-4deg)}60%,85%{transform:rotate(3deg)}}
  @keyframes raise{0%,4%{transform:rotate(-5deg)}14%,40%{transform:rotate(-158deg)}50%,100%{transform:rotate(-5deg)}}
  @keyframes wave{0%,14%{transform:rotate(0)}18%{transform:rotate(-24deg)}22%{transform:rotate(18deg)}26%{transform:rotate(-24deg)}30%{transform:rotate(18deg)}34%{transform:rotate(-20deg)}38%,100%{transform:rotate(0)}}
  @keyframes present{0%,50%{transform:rotate(-6deg)}60%,86%{transform:rotate(38deg)}96%,100%{transform:rotate(-6deg)}}
  @keyframes presentF{0%,50%{transform:rotate(0)}60%,86%{transform:rotate(-58deg)}96%,100%{transform:rotate(0)}}
  @keyframes blink{0%,46%,50%,100%{transform:scaleY(1)}48%{transform:scaleY(.1)}}
  @media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style>

<ellipse class="shadowE" cx="180" cy="606" rx="96" ry="14" fill="url(#shadow)"/>

<g class="body">
  <!-- legs -->
  <path d="M142 372 h38 l-2 214 a8 8 0 0 1 -8 8 h-20 a8 8 0 0 1 -8 -8 z" fill="url(#pants)"/>
  <path d="M180 372 h38 l0 214 a8 8 0 0 1 -8 8 h-20 a8 8 0 0 1 -8 -8 z" fill="url(#pants)"/>
  <path d="M180 380 v190" stroke="#14172e" stroke-width="2" opacity=".5"/>
  <!-- shoes -->
  <path d="M136 586 h44 v10 a10 10 0 0 1 -10 10 h-40 a12 12 0 0 1 -12 -12 a10 10 0 0 1 10 -8 z" fill="url(#shoe)"/>
  <path d="M120 600 h60" stroke="#c4c7d2" stroke-width="5" stroke-linecap="round"/>
  <path d="M182 586 h44 a10 10 0 0 1 10 8 a12 12 0 0 1 -12 12 h-40 a10 10 0 0 1 -10 -10 z" fill="url(#shoe)"/>
  <path d="M182 600 h58" stroke="#c4c7d2" stroke-width="5" stroke-linecap="round"/>

  <!-- presenting arm (character's right, viewer's left) -->
  <g class="presentArm">
    <path d="M110 226 q14 -10 28 0 l-2 80 h-24 z" fill="url(#sleeve)"/>
    <g class="presentFore">
      <rect x="111" y="294" width="26" height="14" rx="6" fill="#e6e8ef"/>
      <path d="M113 306 h22 l-2 52 h-18 z" fill="url(#skinL)"/>
      <ellipse cx="124" cy="366" rx="13" ry="15" fill="url(#skin)"/>
      <path d="M113 366 q-4 8 2 14" stroke="#c48a63" stroke-width="5" stroke-linecap="round" fill="none"/>
    </g>
  </g>

  <!-- torso -->
  <path d="M126 222 q54 -22 108 0 q10 6 8 22 l-14 132 h-96 l-14 -132 q-2 -16 8 -22z" fill="url(#shirt)"/>
  <path d="M138 376 h84 v10 h-84 z" fill="#1d2140"/>
  <rect x="174" y="377" width="12" height="8" rx="2" fill="#b9b3a6"/>
  <path d="M180 218 v156" stroke="#d3d6e0" stroke-width="2"/>
  <g fill="#c9ccd8"><circle cx="184" cy="250" r="2.2"/><circle cx="184" cy="285" r="2.2"/><circle cx="184" cy="320" r="2.2"/><circle cx="184" cy="352" r="2.2"/></g>
  <path d="M150 300 q30 8 60 0" stroke="#e1e3ea" stroke-width="3" fill="none"/>

  <!-- waving arm (character's left, viewer's right) -->
  <g class="waveArm">
    <path d="M222 226 q14 -10 28 0 l-2 80 h-24 z" fill="url(#sleeve)"/>
    <g class="waveFore">
      <rect x="223" y="294" width="26" height="14" rx="6" fill="#e6e8ef"/>
      <path d="M225 306 h22 l-2 52 h-18 z" fill="url(#skinL)"/>
      <ellipse cx="236" cy="368" rx="14" ry="17" fill="url(#skin)"/>
      <g stroke="#d49b74" stroke-width="5.5" stroke-linecap="round">
        <path d="M229 378 v10"/><path d="M235 380 v12"/><path d="M241 379 v10"/><path d="M247 374 v8"/>
      </g>
      <path d="M223 360 q-8 4 -8 12" stroke="#d49b74" stroke-width="6" stroke-linecap="round" fill="none"/>
    </g>
  </g>

  <!-- neck + collar -->
  <path d="M164 190 h32 v30 q-16 10 -32 0 z" fill="#b98059"/>
  <path d="M158 214 l22 22 l-10 14 l-20 -26 z" fill="#ffffff" stroke="#d6d9e2" stroke-width="1.5"/>
  <path d="M202 214 l-22 22 l10 14 l20 -26 z" fill="#ffffff" stroke="#d6d9e2" stroke-width="1.5"/>

  <!-- head -->
  <g class="head">
    <!-- ears -->
    <ellipse cx="123" cy="132" rx="9" ry="14" fill="#c98f68"/>
    <ellipse cx="237" cy="132" rx="9" ry="14" fill="#c98f68"/>
    <path d="M121 126 q4 6 0 12" stroke="#a8714f" stroke-width="2" fill="none"/>
    <path d="M239 126 q-4 6 0 12" stroke="#a8714f" stroke-width="2" fill="none"/>
    <!-- face: broad, full -->
    <path d="M126 112 q0 -50 54 -54 q54 4 54 54 q2 34 -6 52 q-14 30 -48 32 q-34 -2 -48 -32 q-8 -18 -6 -52z" fill="url(#skin)"/>
    <!-- beard: dense, rounded below the jaw, high cheek line -->
    <path d="M126 116 q-2 30 4 50 q8 22 30 30 q20 8 40 0 q20 -8 30 -30 q6 -20 4 -50
             q-4 18 -10 26 q-6 4 -14 2 q-8 -8 -30 -8 q-22 0 -30 8 q-8 2 -14 -2 q-6 -8 -10 -26z" fill="url(#beard)"/>
    <!-- cheek line softening -->
    <path d="M134 140 q14 8 26 6 M226 140 q-14 8 -26 6" stroke="#2a1d15" stroke-width="3" fill="none" opacity=".5" stroke-linecap="round"/>
    <!-- beard texture -->
    <g stroke="#3d2c22" stroke-width="1.4" opacity=".55" stroke-linecap="round">
      <path d="M150 176 l2 7"/><path d="M162 182 l1 7"/><path d="M176 185 l0 7"/><path d="M190 184 l-1 7"/><path d="M204 178 l-2 7"/>
      <path d="M142 162 l2 7"/><path d="M216 164 l-2 7"/>
    </g>
    <!-- closed-lip smile -->
    <path d="M164 164 q16 7 32 0" stroke="#8a4a3c" stroke-width="3.6" fill="none" stroke-linecap="round"/>
    <path d="M167 166 q13 4 26 0" stroke="#b06b5a" stroke-width="1.8" fill="none" stroke-linecap="round"/>
    <!-- mustache: thick, joins beard -->
    <path d="M150 162 q6 -12 18 -13 q8 0 12 4 q4 -4 12 -4 q12 1 18 13 q-8 -3 -16 -4 q-8 0 -14 2 q-6 -2 -14 -2 q-8 1 -16 4z" fill="#1a110c"/>
    <!-- nose: broad, rounded tip -->
    <path d="M175 112 q-2 16 -6 24" stroke="#b57a54" stroke-width="2" fill="none" stroke-linecap="round" opacity=".7"/>
    <ellipse cx="180" cy="140" rx="11" ry="8" fill="#d39a74"/>
    <path d="M166 142 q-3 6 4 8 q4 -1 6 -3 M194 142 q3 6 -4 8 q-4 -1 -6 -3" stroke="#9c6444" stroke-width="2.4" fill="none" stroke-linecap="round"/>
    <ellipse cx="182" cy="137" rx="4" ry="2.5" fill="#f0c4a0" opacity=".7"/>
    <!-- eyes: almond, heavy upper lid -->
    <g class="eye">
      <path d="M146 114 q12 -9 24 0 q-12 7 -24 0z" fill="#fff"/>
      <circle cx="158" cy="114" r="5" fill="#3a2418"/><circle cx="158" cy="114" r="2.2" fill="#140c08"/><circle cx="160" cy="112.4" r="1.4" fill="#fff"/>
      <path d="M145 114 q13 -11 26 0" stroke="#2a1a12" stroke-width="3" fill="none" stroke-linecap="round"/>
      <path d="M148 120 q10 3 20 0" stroke="#a8714f" stroke-width="1.4" fill="none" opacity=".6"/>
    </g>
    <g class="eye">
      <path d="M190 114 q12 -9 24 0 q-12 7 -24 0z" fill="#fff"/>
      <circle cx="202" cy="114" r="5" fill="#3a2418"/><circle cx="202" cy="114" r="2.2" fill="#140c08"/><circle cx="204" cy="112.4" r="1.4" fill="#fff"/>
      <path d="M189 114 q13 -11 26 0" stroke="#2a1a12" stroke-width="3" fill="none" stroke-linecap="round"/>
      <path d="M192 120 q10 3 20 0" stroke="#a8714f" stroke-width="1.4" fill="none" opacity=".6"/>
    </g>
    <!-- brows: thick, nearly straight -->
    <path d="M142 101 q14 -7 30 -3 l0 5 q-15 -3 -30 2z" fill="#1d130d"/>
    <path d="M188 98 q16 -4 30 3 l0 4 q-15 -5 -30 -2z" fill="#1d130d"/>
    <!-- hair: full volume, swept up and back, side part -->
    <path d="M124 118 q-6 -40 14 -60 q22 -22 56 -18 q36 4 46 32 q6 18 0 46
             q-4 -16 -8 -24 q-4 -14 -16 -18 q-20 -4 -44 0 q-20 4 -30 -2 q-10 10 -12 24 q-3 10 -6 20z" fill="url(#hair)"/>
    <path d="M150 44 q24 -12 56 -4 q22 6 30 24 q-20 -18 -52 -18 q-20 0 -34 -2z" fill="#2b1e16"/>
    <g stroke="#4a362a" stroke-width="2.2" fill="none" opacity=".55" stroke-linecap="round">
      <path d="M156 58 q22 -14 52 -6"/><path d="M150 68 q26 -12 60 -2"/><path d="M146 52 q-8 8 -12 20"/>
    </g>
    <!-- quiff: extra height swept up and back -->
    <path d="M138 70 q4 -38 46 -42 q40 -2 54 24 q4 8 2 16 q-14 -20 -44 -22 q-34 -2 -58 24z" fill="url(#hair)"/>
    <path d="M152 46 q22 -14 50 -10 q18 4 28 16" stroke="#4a362a" stroke-width="2.2" fill="none" opacity=".55" stroke-linecap="round"/>
    <!-- side part line -->
    <path d="M148 62 q-6 6 -10 16" stroke="#0e0906" stroke-width="2" fill="none" opacity=".7"/>
  </g>
</g>
</svg>
